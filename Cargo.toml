[package]
name = "backremove"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "Bounded native background removal service"
publish = false
default-run = "backremove"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio", "query"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["cors", "trace", "limit"] }
multer = "=3.1.0"
bytes = "1.11"
futures-util = "0.3"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
subtle = "=2.6.1"
ipnet = "2"
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
libloading = "0.9"
half = "2"
flume = "0.12"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png", "webp", "gif", "avif-native"] }
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std"] }
resvg = { version = "=0.48.1", default-features = false, features = ["text", "raster-images"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-26", "cuda", "half"] }
roxmltree = "=0.21.1"
data-url = "=0.3.2"
mp4parse = "=0.17.0"
dav1d-sys = "=0.8.3"
gif = "=0.14.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }

[patch.crates-io]
# Upstream 0.8.3 swaps two operating-point field widths and corrupts the
# sequence-header ABI. The local copy is checked against native headers at build.
dav1d-sys = { path = "vendor/dav1d-sys" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
